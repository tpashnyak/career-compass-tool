<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Compass &middot; Business Pathways</title>
<style>
:root{
  --navy:#0A1B33;
  --navy-deep:#060F20;
  --navy-soft:#12294A;
  --navy-line:rgba(201,162,39,.26);
  --gold:#C9A227;
  --gold-soft:#E6CC7E;
  --cream:#F4EFE4;
  --paper:#FBF8F1;
  --ink:#101A2B;
  --slate:#9DAAC0;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #16305a 0%, transparent 60%),
    var(--navy-deep);
  color:var(--cream);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.frame{max-width:820px;margin:0 auto;padding:0 20px 80px}

/* ---------- masthead ---------- */
.masthead{
  padding:38px 0 22px;
  border-bottom:1px solid var(--navy-line);
  margin-bottom:34px;
}
.mark{
  font-family:var(--mono);
  font-size:11.5px;
  letter-spacing:.22em;
  color:var(--gold);
  margin:0 0 10px;
}
.masthead h1{
  font-family:var(--serif);
  font-weight:600;
  font-size:clamp(34px,7vw,54px);
  line-height:1.05;
  margin:0 0 8px;
  color:#fff;
}
.masthead p{margin:0;color:var(--slate);max-width:56ch}

/* ---------- shared ---------- */
h2{font-family:var(--serif);font-weight:600;font-size:clamp(24px,4.5vw,32px);line-height:1.15;margin:0 0 14px;color:#fff}
h3{font-family:var(--serif);font-weight:600;font-size:21px;margin:0 0 10px}
p{max-width:68ch}
a{color:var(--gold-soft)}
button{font:inherit;cursor:pointer}
.btn{
  display:inline-block;
  background:var(--gold);
  color:#0A1B33;
  border:none;
  border-radius:2px;
  padding:14px 26px;
  font-family:var(--mono);
  font-size:14px;
  letter-spacing:.06em;
  transition:transform .12s ease, background .18s ease;
}
.btn:hover{background:var(--gold-soft)}
.btn:active{transform:translateY(1px)}
.btn.ghost{
  background:transparent;
  color:var(--gold-soft);
  border:1px solid var(--navy-line);
}
.btn.ghost:hover{background:rgba(201,162,39,.10)}
.btn:disabled{opacity:.35;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}

/* ---------- intro ---------- */
.lede{font-size:19px;color:#E8E2D4}
.brief{
  border-left:2px solid var(--gold);
  padding:2px 0 2px 20px;
  margin:28px 0 30px;
}
.brief dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:baseline}
.brief dt{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--gold)}
.brief dd{margin:0;color:#E8E2D4}
.fineprint{color:var(--slate);font-size:14px;margin-top:26px}

/* ---------- survey ---------- */
.meter{margin-bottom:26px}
.meter .row{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--slate);margin-bottom:8px}
.meter .track{height:2px;background:rgba(255,255,255,.12)}
.meter .fill{height:2px;background:var(--gold);transition:width .3s ease}
.qhead{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--gold);margin:0 0 12px}
.qtext{font-family:var(--serif);font-size:clamp(23px,4.6vw,30px);line-height:1.25;margin:0 0 26px;color:#fff}
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:30px}
.opt{
  display:flex;gap:16px;align-items:flex-start;
  width:100%;text-align:left;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.10);
  border-radius:2px;
  color:var(--cream);
  padding:15px 18px;
  transition:border-color .15s ease, background .15s ease;
}
.opt:hover{border-color:var(--gold);background:rgba(201,162,39,.07)}
.opt .key{font-family:var(--mono);font-size:13px;color:var(--gold);padding-top:2px;min-width:16px}
.opt[aria-pressed="true"]{border-color:var(--gold);background:rgba(201,162,39,.14)}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:30px}
.scale .opt{flex-direction:column;gap:6px;align-items:flex-start;justify-content:flex-end;min-height:104px}
.scale .num{font-family:var(--mono);font-size:12px;color:var(--gold)}
.scale .lab{font-size:15px;line-height:1.3}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.linkish{background:none;border:none;color:var(--slate);font-family:var(--mono);font-size:13px;padding:8px 0}
.linkish:hover{color:var(--gold-soft)}

/* ---------- results ---------- */
.podium{display:flex;flex-direction:column;gap:0;margin:6px 0 34px;border-top:1px solid var(--navy-line)}
.match{
  display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;
  padding:16px 4px;border-bottom:1px solid rgba(255,255,255,.09);
  width:100%;background:none;border-left:none;border-right:none;border-top:none;
  color:var(--cream);text-align:left;
}
.match:hover .mname{color:var(--gold-soft)}
.match .rank{font-family:var(--mono);font-size:12px;color:var(--gold);width:22px}
.mname{font-family:var(--serif);font-size:20px;line-height:1.2;transition:color .15s ease}
.mbar{height:3px;background:rgba(255,255,255,.12);margin-top:8px;max-width:420px}
.mbar span{display:block;height:3px;background:var(--gold)}
.match .pct{font-family:var(--mono);font-size:15px;color:var(--gold)}
.match.dim .mname{font-size:17px;color:var(--slate)}
.match.dim .pct{color:var(--slate)}
.match.dim .mbar span{background:rgba(157,170,192,.6)}

/* dossier */
.dossier{
  background:var(--paper);
  color:var(--ink);
  border-radius:2px;
  padding:34px 32px;
  margin:0 0 22px;
  box-shadow:0 18px 40px rgba(0,0,0,.35);
}
.dossier .kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;color:#8A6D14;margin:0 0 8px}
.dossier h3{font-size:clamp(24px,4.4vw,31px);margin:0 0 10px;color:var(--ink)}
.dossier .tagline{font-family:var(--serif);font-style:italic;font-size:19px;color:#3E4A5E;margin:0 0 18px;max-width:60ch}
.dossier p{color:#28303E}
.block{border-top:1px solid rgba(16,26,43,.14);padding-top:16px;margin-top:20px}
.block h4{font-family:var(--mono);font-size:12px;letter-spacing:.13em;color:#8A6D14;margin:0 0 10px;font-weight:400}
.block ul{margin:0;padding-left:18px}
.block li{margin-bottom:7px;color:#28303E}
.block li b{font-weight:600}
.roles{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.roles li{
  font-size:14.5px;background:#0A1B33;color:var(--cream);
  padding:6px 11px;border-radius:2px;margin:0;
}
.check{
  background:#F0E9D8;border-left:2px solid var(--gold);
  padding:12px 16px;margin-top:18px;font-size:15px;color:#3A3320;
}
.check b{font-family:var(--mono);font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px;color:#8A6D14;font-weight:400}

/* reflection */
.reflect{border-top:1px solid var(--navy-line);padding-top:26px;margin-top:34px}
.reflect label{display:block;margin-bottom:22px}
.reflect .prompt{font-family:var(--serif);font-size:18px;margin-bottom:8px;display:block}
.reflect textarea{
  width:100%;min-height:78px;resize:vertical;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);
  color:var(--cream);font:inherit;font-size:16px;padding:12px 14px;border-radius:2px;
}
.reflect textarea:focus{border-color:var(--gold)}
.namebar{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:26px}
.namebar input{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);
  color:var(--cream);font:inherit;padding:11px 13px;border-radius:2px;width:100%;
}
.namebar input:focus{border-color:var(--gold)}
.namebar span{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--slate);display:block;margin-bottom:6px}

.tabs{display:flex;gap:22px;border-bottom:1px solid var(--navy-line);margin:0 0 26px}
.tab{
  background:none;border:none;color:var(--slate);
  font-family:var(--mono);font-size:13px;letter-spacing:.08em;
  padding:0 0 12px;border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:30px 0 10px}
footer.foot{
  border-top:1px solid var(--navy-line);margin-top:50px;padding-top:18px;
  font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--slate);
}
.printhead{display:none}

@media (max-width:620px){
  body{font-size:16px}
  .scale{grid-template-columns:repeat(2,1fr)}
  .namebar{grid-template-columns:1fr}
  .dossier{padding:26px 20px}
  .match{grid-template-columns:auto 1fr;row-gap:4px}
  .match .pct{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
@media print{
  body{background:#fff;color:#000}
  .frame{max-width:100%;padding:0}
  .masthead,.tabs,.toolbar,.foot,.navrow,.linkish{display:none !important}
  .printhead{display:block;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:18px}
  .printhead h1{font-family:var(--serif);font-size:24px;margin:0 0 4px}
  .printhead .line{font-family:var(--mono);font-size:12px}
  .dossier{box-shadow:none;border:1px solid #999;page-break-inside:avoid;margin-bottom:16px}
  .match{color:#000;border-bottom:1px solid #999}
  .mname,.match .pct,.match .rank{color:#000 !important}
  .mbar{background:#ddd}
  .mbar span{background:#666}
  .reflect textarea,.namebar input{background:#fff;color:#000;border:1px solid #999}
  .roles li{background:#eee;color:#000;border:1px solid #bbb}
  h2,h3{color:#000}
  .reflect .prompt{color:#000}
}
</style>
</head>
<body>
<div class="frame">

  <div class="printhead" id="printhead"></div>

  <header class="masthead">
    <p class="mark">Business Pathways Program</p>
    <h1>Career Compass</h1>
    <p>Eighteen questions about how you think, what you notice, and what you'd rather be doing &mdash; then a plan for what to take, study, earn, or license next.</p>
  </header>

  <main id="app"></main>

  <footer class="foot">
    Career Compass &middot; a survey and planning tool for business students
  </footer>
</div>

<script>
"use strict";

/* ============================================================
   PATHWAYS
   ============================================================ */
const PATHWAYS = {
  marketing: {

    tagline: "Figure out what people actually want, then build the story that reaches them.",

    hs: ["AP Business with Personal Finance","AP Psychology &mdash; buyer behavior is applied psych","AP English Language &mdash; persuasion and audience","AP Statistics &mdash; survey and A/B test literacy","Marketing or Digital Media CTAE pathway courses"],
    degrees: ["B.B.A. in Marketing (most common route)","B.S. in Advertising, Public Relations, or Communication","B.S. in Marketing Analytics if you like the data side","Associate degree in Marketing Management &rarr; transfer or coordinator roles","Later: M.B.A. or M.S. in Marketing Analytics"],
    noDegree: ["Certifications plus a real portfolio get people hired here without a degree &mdash; this is one of the most credential-flexible fields in business","Social media coordinator, e-commerce seller, or freelance content work while you build proof","Agency internship or assistant role &rarr; coordinator &rarr; manager, learning it on the job","Technical college certificate in digital media, web design, or graphic design"],
    certs: ["Google Analytics (GA4) Certification &mdash; free, do it in high school","Google Ads Search Certification &mdash; free","HubSpot Inbound Marketing and Content Marketing &mdash; free","Meta Certified Digital Marketing Associate","Adobe Certified Professional (Photoshop, Premiere Pro)","Hootsuite Platform Certification"],
    now: ["Run social media for a club or a local business and keep the before/after numbers","Build a portfolio: three campaigns, each with the goal, the work, and the result","Compete in DECA or FBLA marketing and advertising events","Rewrite one bad ad you see this week and explain what you changed"],
    orgs: ["DECA","FBLA","school newspaper or yearbook business staff"],
    check: "A marketing portfolio outranks a marketing GPA. Employers ask what you launched and what happened &mdash; start collecting evidence now, even from unpaid projects."
  },
  finance: {
    name: "Finance &amp; Investment",
    plain: "Finance & Investment",
    tagline: "Decide where money should go and defend the decision with numbers.",
    blurb: "Finance is forecasting under uncertainty. You value things, weigh risk against return, and make recommendations that can be wrong in public. It rewards people who are comfortable with math, pressure, and being questioned.",
    roles: ["Financial Analyst","Investment Banking Analyst","Personal Financial Advisor","Credit Analyst","Corporate Treasury Analyst","Commercial Real Estate Analyst"],
    hs: ["AP Business with Personal Finance","AP Calculus AB or BC","AP Statistics","AP Macroeconomics and AP Microeconomics","Dual-enrollment Principles of Accounting &mdash; finance runs on accounting"],
    degrees: ["B.B.A. or B.S. in Finance","B.A./B.S. in Economics (strong for analyst roles and law school)","B.S. in Quantitative Finance or Financial Mathematics","Later: M.S. in Finance or an M.B.A. after work experience"],
    noDegree: ["Bank teller &rarr; personal banker &rarr; branch manager is a real ladder, and most banks will pay for your degree along the way","Mortgage loan originator: an NMLS license takes 20 hours of coursework and an exam, no degree required","Insurance producer license, or the SIE exam at 18 and a firm that sponsors your Series licenses","Registered tax preparer &mdash; get a PTIN from the IRS and work tax seasons while you decide","Be clear-eyed: corporate analyst jobs still want the bachelor's. The licensed, client-facing roles do not."],
    certs: ["Bloomberg Market Concepts (BMC) &mdash; short, doable as a student","SIE exam (Securities Industry Essentials) &mdash; open at 18, no sponsor needed","Series 7 and 63 &mdash; require an employer sponsor, so these come with the job","FMVA financial modeling certification","CFP for financial planning; CFA for investment analysis &mdash; both are after your degree"],
    now: ["Model a real company's revenue in a spreadsheet, then check your forecast against its next earnings report","Run a stock market game and write down why you bought, not just what","Compete in FBLA Securities and Investments or Personal Finance events","Learn keyboard-only Excel &mdash; it is the actual daily tool"],
    orgs: ["FBLA","investment or stock club","Junior Achievement"],
    check: "Interviews test modeling and mental math, not personality. Two clean spreadsheets you built yourself will do more for you than a long resume of memberships."
  },
  accounting: {
    name: "Accounting &amp; Assurance",
    plain: "Accounting & Assurance",
    tagline: "Every dollar has a story. Your job is to make sure the story is true.",
    blurb: "Accounting is the language every other business function has to speak. It is stable, portable, and in constant shortage &mdash; and the work has moved from data entry to judgment, systems, and investigation.",
    roles: ["Staff Accountant","External or Internal Auditor","Tax Associate","Forensic Accountant","Controller","Government or Nonprofit Accountant"],
    hs: ["AP Business with Personal Finance","Accounting I and II CTAE courses","Dual-enrollment Principles of Accounting I","AP Statistics","Any course that builds spreadsheet fluency"],
    degrees: ["B.B.A. in Accounting &mdash; the standard path","Master of Accountancy (M.Acc.) &mdash; often used to reach CPA credit requirements","Associate degree in Accounting &rarr; bookkeeping, AP/AR, and payroll roles","B.S. in Accounting Information Systems if you like the tech side"],
    noDegree: ["Bookkeeping is wide open without a degree &mdash; Intuit certification, QuickBooks ProAdvisor status, and clients of your own","Accounts payable or receivable clerk &rarr; senior clerk &rarr; accounting supervisor, often with employer tuition help","Payroll: the Fundamental Payroll Certification (FPC) has no degree requirement","Seasonal tax preparation with a PTIN, then build it into a year-round practice","The CPA license does require a degree, so plan for one if public accounting or audit is the goal"],
    certs: ["Intuit Certified Bookkeeping Professional &mdash; entry level, take it in high school","QuickBooks Certified User","Microsoft Excel Expert (MO-201)","CPA &mdash; after your degree; credit-hour and exam rules vary by state and have been changing","CMA (management accounting), CIA (internal audit), CFE (fraud examination)"],
    now: ["Keep the books for a club or a family business for one full semester","Do a bank reconciliation by hand once so you understand what software is doing","Compete in FBLA Accounting or Introduction to Financial Math events","Ask a local CPA firm about busy-season office help in January&ndash;April"],
    orgs: ["FBLA","BPA","VITA volunteer tax prep once you are trained"],
    check: "Check your own state board of accountancy before planning your credit hours. CPA licensure requirements differ by state and several states have recently added new routes."
  },
  operations: {
    name: "Management &amp; Operations",
    plain: "Management & Operations",
    tagline: "Take something messy and slow, and make it run.",
    blurb: "Operations is where strategy meets reality: people, inventory, schedules, and constraints. If you are the person who reorganizes the supply closet without being asked, this is a real career and it pays well.",

    degrees: ["B.B.A. in Management or Operations and Supply Chain Management","B.S. in Industrial Engineering (more math, higher starting pay)","B.S. in Logistics or Transportation Management","Associate degree in Logistics or Business Management"],

    certs: ["ASCM/APICS CPIM &mdash; production and inventory management","ASCM/APICS CSCP &mdash; end-to-end supply chain","Lean Six Sigma Yellow Belt, then Green Belt","CAPM &rarr; PMP for project management (PMP requires experience)","OSHA 10-hour for industrial settings"],
    now: ["Run an event end to end &mdash; budget, schedule, supplies, volunteers, debrief","Time a real process (lunch line, drive-through, fundraiser table) and cut a step out","Track inventory and shrinkage for a club fundraiser","Learn one project board tool and one spreadsheet scheduling method"],
    orgs: ["FBLA","BPA","robotics or any team where you can be the logistics lead"],
    check: "Supply chain hiring is regional. Look at what ships near you &mdash; ports, distribution centers, food processing, manufacturing &mdash; and target those employers early with internships."
  },
  entrepreneurship: {
    name: "Entrepreneurship &amp; Innovation",
    plain: "Entrepreneurship & Innovation",
    tagline: "Notice a problem, build the fix, and find out fast whether anyone will pay for it.",
    blurb: "Entrepreneurship is less about the idea and more about the loop: build, sell, measure, adjust. Most founders start by working somewhere else first and learning an industry from the inside &mdash; that is not a detour, it is the training.",
    roles: ["Small Business Owner","Franchise Owner","Product Manager","Business Development Lead","Startup Operations Associate","Creator or freelance service business"],
    hs: ["AP Business with Personal Finance","Entrepreneurship CTAE pathway","AP Computer Science Principles &mdash; build your own prototype","Accounting I &mdash; founders who cannot read a P&amp;L lose control of the business","Work-based learning or an actual part-time job"],
    degrees: ["B.B.A. in Entrepreneurship or Management","Any major plus a business minor &mdash; industry expertise is the real advantage","Associate degree plus a trade or technical credential (a strong small-business combination)","Free lifelong resource: your local Small Business Development Center and SCORE mentors"],
    noDegree: ["No credential is required to own a business. What is required is a skill people pay for and enough cash to survive the first months.","Trade credential plus ownership is the classic route: HVAC, electrical, welding, cosmetology, diesel, landscaping, trucking authority","Technical college diploma in your trade, then business coursework only as you need it","Free for life: your Small Business Development Center, SCORE mentors, and SBA microloan programs","Franchise ownership screens for capital and operating experience, not for degrees"],
    certs: ["Entrepreneurship and Small Business (ESB) certification","NFTE entrepreneurship coursework and pitch competitions","Google Digital Garage and Skillshop fundamentals","Shopify or Square seller training for e-commerce","ServSafe Manager if you are anywhere near food"],
    now: ["Sell something real this semester and track unit economics: cost, price, margin, hours","Write a one-page business model canvas for your idea, then interview ten potential customers","Enter a pitch competition &mdash; DECA, FBLA, or a local chamber event","Shadow one small business owner for a full day, including the boring parts"],
    orgs: ["DECA","FBLA","4-H or FFA if your idea is ag-related","local chamber of commerce youth programs"],
    check: "Your first business does not have to work. It has to teach you pricing, customers, and cash flow &mdash; which is exactly what the second one needs."
  },
  hr: {
    name: "Human Resources &amp; Talent",
    plain: "Human Resources & Talent",
    tagline: "Companies are people. Someone has to be good at that part.",
    blurb: "HR is part law, part psychology, part data. You hire, develop, pay, and protect the workforce &mdash; and you are the one who has to handle the conversation nobody else wants to have.",

    degrees: ["B.B.A. in Human Resource Management","B.S. in Psychology (strong pairing with an HR minor)","B.S. in Industrial-Organizational Psychology, or an M.S. later","B.A. in Labor and Employment Relations"],
    noDegree: ["HR assistant and coordinator roles regularly hire on experience, and the aPHR certification has no degree requirement","Staffing agency recruiter &mdash; performance-based hiring, fast feedback, and it teaches you the entire hiring process","Payroll or benefits administration through the FPC certification","Promotion from inside is common: shift lead &rarr; trainer &rarr; HR generalist in retail, hospitality, and healthcare","Military human resources and personnel work transfers directly"],
    certs: ["aPHR &mdash; entry level, no work experience required","SHRM-CP &mdash; the standard credential once you have experience","PHR &mdash; alternative to SHRM-CP","Certified Payroll Professional (CPP) for the compensation track","Workplace mediation or conflict resolution training"],
    now: ["Interview two working adults about the best and worst manager they ever had","Run tryouts, auditions, or member selection for something and write the criteria first","Practice interviewing on both sides of the table","Learn what an employee handbook contains and read a real one"],
    orgs: ["FBLA","peer mediation or peer mentoring programs","student government"],
    check: "HR is not the easy business major. Employment law, benefits math, and data reporting are the core of the job; the people skills only get you in the door."
  },
  analytics: {
    name: "Business Analytics &amp; Information Systems",
    plain: "Business Analytics & Information Systems",
    tagline: "The data already exists. Someone has to make it say something useful.",

function maxFor(key){
  let m = 0;
  SCENARIOS.forEach(function(item){
    let best = 0;
    item.o.forEach(function(opt){ if(opt.w[key] && opt.w[key] > best) best = opt.w[key]; });
    m += best;
  });
  STATEMENTS.forEach(function(st){ if(st.p === key) m += 4; });
  return m;
}
const MAXES = {};
KEYS.forEach(function(k){ MAXES[k] = maxFor(k); });

function scores(){
  const s = {};
  KEYS.forEach(function(k){ s[k] = 0; });
  SCENARIOS.forEach(function(item, i){
    const a = answers[i];
    if(a === null) return;
    const w = item.o[a].w;
    for(const k in w) s[k] += w[k];
  });
  STATEMENTS.forEach(function(st, i){
    const a = answers[SCENARIOS.length + i];
    if(a === null) return;
    s[st.p] += (a + 1);
  });
  return KEYS.map(function(k){
    return { key:k, raw:s[k], pct: Math.round((s[k] / MAXES[k]) * 100) };
  }).sort(function(a,b){ return b.pct - a.pct || b.raw - a.raw; });
}

function render(){

  else if(screen === "survey") renderSurvey();

  window.scrollTo({top:0, behavior:"instant"});
}

function renderSurvey(){

  const answered = answers[step];
  const pct = Math.round((step / TOTAL) * 100);

    '</div>';

  if(isRoute){
    html += '<p class="qhead">No wrong answer, and you can change your mind</p>';
    html += '<p class="qtext">' + ROUTE.q + '</p><div class="opts">';

    });
    html += '</div>';
  } else if(isScenario){
    const item = SCENARIOS[step];
    html += '<p class="qhead">Choose the one closest to you</p>';
    html += '<p class="qtext">' + item.q + '</p><div class="opts">';

              '<span class="key">' + "ABCD"[i] + '</span><span>' + opt.t + '</span></button>';
    });
    html += '</div>';
  } else {
    const st = STATEMENTS[step - SCENARIOS.length];
    html += '<p class="qhead">How true is this?</p>';
    html += '<p class="qtext">' + st.s + '</p><div class="scale">';
    SCALE.forEach(function(lab, i){
      html += '<button class="opt" data-i="' + i + '" aria-pressed="' + (answered === i) + '">' +
              '<span class="num">' + (i+1) + '</span><span class="lab">' + lab + '</span></button>';

  html += '<div class="navrow">' +
      (step > 0 ? '<button class="linkish" id="back">&larr; Back</button>' : '<span></span>') +

      else { step++; render(); }

  };

function dossierHTML(key, rank, pct){
  const p = PATHWAYS[key];
  let h = '<article class="dossier">';
  h += '<p class="kicker">' + (rank ? 'Match ' + rank + ' &middot; ' + pct + '% fit' : 'Pathway') + '</p>';
  h += '<h3>' + p.name + '</h3>';
  h += '<p class="tagline">' + p.tagline + '</p>';
  h += '<p>' + p.blurb + '</p>';

  h += '<div class="block"><h4>Where this leads</h4><ul class="roles">';
  p.roles.forEach(function(r){ h += '<li>' + r + '</li>'; });
  h += '</ul></div>';

  h += '<div class="block"><h4>Take these in high school</h4><ul>';
  p.hs.forEach(function(c){ h += '<li>' + c + '</li>'; });
  h += '</ul></div>';

  let degreeBlock = '<div class="block"><h4>If you take the degree route</h4><ul>';
  p.degrees.forEach(function(d){ degreeBlock += '<li>' + d + '</li>'; });
  degreeBlock += '</ul></div>';

  let openBlock = '<div class="block"><h4>Ways in without a four-year degree</h4><ul>';
  p.noDegree.forEach(function(d){ openBlock += '<li>' + d + '</li>'; });
  openBlock += '</ul></div>';

  const r = answers[TOTAL - 1];
  const degreeFirst = (r === null || DEGREE_FIRST.indexOf(r) !== -1);
  h += degreeFirst ? (degreeBlock + openBlock) : (openBlock + degreeBlock);

  h += '<div class="block"><h4>Certifications that open doors</h4><ul>';
  p.certs.forEach(function(c){ h += '<li>' + c + '</li>'; });
  h += '</ul></div>';

  h += '<div class="block"><h4>Start this semester</h4><ul>';
  p.now.forEach(function(n){ h += '<li>' + n + '</li>'; });
  h += '</ul></div>';

  h += '<div class="block"><h4>Where to get involved</h4><p>' + p.orgs.join(' &middot; ') + '</p></div>';

  h += '<div class="check"><b>Reality check</b>' + p.check + '</div>';
  h += '</article>';
  return h;
}

  } else if(e.key === "ArrowLeft" && step > 0){
    step--; render();
  } else if(e.key === "ArrowRight" && answers[step] !== null && step < TOTAL - 1){
    step++; render();
  }
});

render();
</script>
